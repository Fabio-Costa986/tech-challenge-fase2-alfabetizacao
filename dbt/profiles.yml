# Sem credenciais: method=oauth usa Application Default Credentials
# (local: gcloud auth application-default login; Cloud Run: service account do job).
alfab:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: silver
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      priority: interactive
      job_retries: 1
      job_execution_timeout_seconds: 900
      maximum_bytes_billed: "{{ env_var('MAX_BYTES_BILLED', '53687091200') | int }}"
