name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-dbt:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ci-sem-nuvem
      BRONZE_BUCKET: ci-sem-nuvem
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: dbt parse (valida Jinja, refs, testes e unit tests sem conectar ao BigQuery)
        working-directory: dbt
        run: dbt parse --profiles-dir .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
